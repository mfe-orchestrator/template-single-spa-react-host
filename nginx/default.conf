# Runs as the unprivileged nginx user, hence port 8080.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /usr/share/nginx/html;

    # single-spa routes live in the browser: any unknown path serves the root config.
    location / {
        try_files $uri /index.html;
    }

    # index.html carries the import map and the hashed names of everything else,
    # so it must never be cached; the hashed files under assets/ can be, forever.
    location = /index.html {
        add_header Cache-Control 'no-store, no-cache';
        etag off;
        if_modified_since off;
        expires off;
    }

    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
}
